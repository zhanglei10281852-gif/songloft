rubrics:
  - id: 1
    type: f2p
    text: 音乐目录或排除规则更新返回成功时，新配置、当前 Scanner 和曲库清理结果已经共同生效，随后扫描只使用该配置代际。
  - id: 2
    type: f2p
    text: 配置切换与旧手动扫描并发时，已发现、提取中、待批量提交和 CUE 处理中结果均不能在发布边界后写回，扫描进度可确定收敛。
  - id: 3
    type: f2p
    text: 音乐根目录从 A 切换到 B 后，即使 A 中的文件仍存在，A 的旧歌曲记录也会被清除，而 B 下符合新规则的记录保留。
  - id: 4
    type: f2p
    text: 配置保存后的扫描停止、Scanner 构建或清理发生可控失败时返回可观察错误，持久配置、内存 Scanner 和曲库不会停在彼此不一致的中间状态。
  - id: 5
    type: f2p
    text: 自动扫描与配置切换服从同一代际屏障，旧代际不会在切换成功后创建自动歌单、更新完成状态或启动音频指纹任务。
  - id: 6
    type: f2p
    text: 服务重启后只恢复最后一次完整发布的音乐目录配置，失败或未完成切换不会在重启后改变有效曲库归属。
  - id: 7
    type: p2p
    text: 无并发切换时的手动和自动扫描、用户取消后保留已提取成果、默认配置、仅修改排除规则以及既有进度和错误响应保持兼容。
